name: Build DRUMFORGE Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S DrumForge -B build -DCMAKE_BUILD_TYPE=Release -DDRUMFORGE_COPY_AFTER_BUILD=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target DRUMFORGE_VST3 --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: DRUMFORGE-windows-vst3
          path: build/DRUMFORGE_artefacts/Release/VST3/
